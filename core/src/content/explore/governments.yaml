adopters:
  heading: Governments already using NixOS
  items:
    - name: 'DAWO: Core'
      meta: Netherlands · Digitaal Autonome Werkomgeving Overheid
      flag: flag:nl-4x3
      text: >
        DAWO (Digitaal Autonome Werkomgeving Overheid) Core is a modular, open-source
        workplace for public administration with a NixOS-based desktop. In July
        2026, the state IT providers SSC-ICT, DICTU and DUO-ICT were
        commissioned to develop a sovereign digital work environment for the
        Dutch government. Several municipalities are piloting it.
      links:
        - label: Press release
          href: https://www.ssc-ict.nl/actueel/nieuws/2026/8/6/ssc-ict-dictu-en-duo-ict-samen-aan-de-slag-voor-een-soevereine-digitale-werkomgeving
        - label: Source code
          href: https://codeberg.org/DAWO/DAWO-Core
    - name: 'DINUM: Sécurix'
      meta: France · Interministerial digital directorate
      flag: flag:fr-4x3
      text: >
        DINUM, the French government's digital directorate, has announced its
        move from Windows to Linux workstations. It develops Sécurix, a hardened
        NixOS distribution built on ANSSI security recommendations, which is
        currently in alpha.
      links:
        - label: Press release
          href: https://www.numerique.gouv.fr/sinformer/espace-presse/souverainete-numerique-reduction-dependances-extra-europeennes/
        - label: Source code
          href: https://github.com/cloud-gouv/securix

cta:
  heading: Questions? Talk to us!
  text: >
    Planning to use NixOS for your government needs and have questions? The NixOS Foundation is happy to 
    help you. Just schedule a call and we reach out to you with further information.
  button:
    label: Schedule a call
    icon: mdi:calendar-clock
    href: mailto:foundation@nixos.org?subject=NixOS%20for%20Governments%3A%20Call%20request
