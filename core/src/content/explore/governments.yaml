intro: >
  Government IT is hard to manage. Many departments, constantly changing
  requirements and fleets that can grow to thousands of devices make it easy
  to lose oversight. Over time, the resulting inconsistencies can lead to
  breaches and malfunctions. NixOS can help solve these challenges.

benefits:
  heading: Why NixOS for governments?
  items:
    - title: Auditability
      icon: mdi:clipboard
      text: >
        Because your NixOS infrastructure is fully described in code, oversight
        and audits become much easier. See what runs on which machine and keep a
        complete audit trail in a version control system (VCS). There's no need
        to collect information from dozens of sources for compliance and
        security reviews.
    - title: Uniform fleets
      icon: mdi:bricks
      text: >
        Departments have different needs, but they don't need separate setups.
        Share a baseline for commonly used tools and VPN configuration across
        the whole fleet, and extend it with modules for each department. This
        keeps the fleet maintainable and prevents configuration drift.
    - title: Resilience
      icon: mdi:backup-restore
      text: >
        A failed system update can disrupt government operations. NixOS applies
        updates atomically, so a system is always either fully on the old
        generation or fully on the new one. If something goes wrong, devices can
        be rolled back to their previous state, which reduces downtime and
        enables fast recovery.
    - title: Supply-chain transparency
      icon: mdi:package-variant-closed
      text: >
        With NixOS, you can inspect the complete dependency tree of every
        package, or of the whole system. This makes it easy to generate software
        bills of materials and to see which parts are affected by a
        vulnerability. Largely reproducible builds help you verify what you
        deploy.
    - title: Digital sovereignty
      icon: mdi:shield-lock
      text: >
        NixOS is not tied to a single vendor, and all of its components are open
        source and interchangeable. You can host your own package repositories,
        or even swap the implementation of Nix itself. This helps you keep full
        control over your infrastructure, costs and data.
    - title: Long-term maintainability
      icon: mdi:calendar-clock
      text: >
        Your configuration drives NixOS, so it doubles as living documentation
        of your infrastructure. Instead of writing down how each system is set
        up, the configuration shows it. New staff can be onboarded quickly, and
        changing requirements are easy to handle across the whole fleet.

