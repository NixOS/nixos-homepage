<svg viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata>
  <!-- Background -->
  <rect width="1600" height="1200" fill="#eeeeee"/>
  
  <!-- Title Section -->
  <rect x="0" y="0" width="1600" height="80" fill="#28395f"/>
  <text x="800" y="50" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="white">
    Nix Binary Cache: Directory Structure Explained
  </text>
  
  <!-- Main Container -->
  <g id="main-container">
    <!-- File Tree Visualization -->
    <g id="file-tree">
      <rect x="50" y="120" width="500" height="600" rx="10" fill="#ffffff" stroke="#3b5487" stroke-width="2"/>
      <rect x="50" y="120" width="500" height="50" rx="10" fill="#3b5487"/>
      <text x="300" y="150" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
        Binary Cache Structure
      </text>
      
      <!-- Root -->
      <text x="80" y="210" font-family="monospace" font-size="16" fill="#28395f">📁 /</text>
      
      <!-- log directory -->
      <line x1="100" y1="220" x2="100" y2="240" stroke="#3d98d1" stroke-width="2"/>
      <line x1="100" y1="240" x2="120" y2="240" stroke="#3d98d1" stroke-width="2"/>
      <text x="130" y="245" font-family="monospace" font-size="14" fill="#717171">📁 log/</text>
      
      <!-- nar directory -->
      <line x1="100" y1="240" x2="100" y2="270" stroke="#3d98d1" stroke-width="2"/>
      <line x1="100" y1="270" x2="120" y2="270" stroke="#3d98d1" stroke-width="2"/>
      <text x="130" y="275" font-family="monospace" font-size="14" fill="#a8545b" font-weight="bold">📁 nar/</text>
      
      <!-- NAR files -->
      <line x1="150" y1="280" x2="150" y2="300" stroke="#3d98d1" stroke-width="1"/>
      <line x1="150" y1="300" x2="170" y2="300" stroke="#3d98d1" stroke-width="1"/>
      <text x="180" y="305" font-family="monospace" font-size="12" fill="#4d6fb7">📦 05wzh2qx...hk.nar.xz</text>
      
      <line x1="150" y1="300" x2="150" y2="320" stroke="#3d98d1" stroke-width="1"/>
      <line x1="150" y1="320" x2="170" y2="320" stroke="#3d98d1" stroke-width="1"/>
      <text x="180" y="325" font-family="monospace" font-size="12" fill="#4d6fb7">📦 05xvdgcl...p91.nar.xz</text>
      
      <line x1="150" y1="320" x2="150" y2="340" stroke="#3d98d1" stroke-width="1"/>
      <line x1="150" y1="340" x2="170" y2="340" stroke="#3d98d1" stroke-width="1"/>
      <text x="180" y="345" font-family="monospace" font-size="12" fill="#4d6fb7">📦 09pbh93p...109.nar.zst</text>
      
      <text x="180" y="365" font-family="monospace" font-size="12" fill="#3d98d1">...</text>
      
      <!-- nix-cache-info -->
      <line x1="100" y1="270" x2="100" y2="390" stroke="#3d98d1" stroke-width="2"/>
      <line x1="100" y1="390" x2="120" y2="390" stroke="#3d98d1" stroke-width="2"/>
      <text x="130" y="395" font-family="monospace" font-size="14" fill="#955890">📄 nix-cache-info</text>
      
      <!-- realisations directory -->
      <line x1="100" y1="390" x2="100" y2="420" stroke="#3d98d1" stroke-width="2"/>
      <line x1="100" y1="420" x2="120" y2="420" stroke="#3d98d1" stroke-width="2"/>
      <text x="130" y="425" font-family="monospace" font-size="14" fill="#8a6e08">📁 realisations/</text>
      
      <line x1="150" y1="430" x2="150" y2="450" stroke="#3d98d1" stroke-width="1"/>
      <line x1="150" y1="450" x2="170" y2="450" stroke="#3d98d1" stroke-width="1"/>
      <text x="180" y="455" font-family="monospace" font-size="11" fill="#3d98d1">sha256:25ee43...out.doi</text>
      
      <!-- .narinfo files -->
      <line x1="100" y1="420" x2="100" y2="480" stroke="#3d98d1" stroke-width="2"/>
      <line x1="100" y1="480" x2="120" y2="480" stroke="#3d98d1" stroke-width="2"/>
      <text x="130" y="485" font-family="monospace" font-size="14" fill="#378450" font-weight="bold">📄 29mhfr5g...l.narinfo</text>
      
      <line x1="100" y1="480" x2="100" y2="510" stroke="#3d98d1" stroke-width="2"/>
      <line x1="100" y1="510" x2="120" y2="510" stroke="#3d98d1" stroke-width="2"/>
      <text x="130" y="515" font-family="monospace" font-size="14" fill="#378450" font-weight="bold">📄 6nkqdqzp...sb.narinfo</text>
      
      <line x1="100" y1="510" x2="100" y2="540" stroke="#3d98d1" stroke-width="2"/>
      <line x1="100" y1="540" x2="120" y2="540" stroke="#3d98d1" stroke-width="2"/>
      <text x="130" y="545" font-family="monospace" font-size="14" fill="#378450" font-weight="bold">📄 cg9s562s...0i.narinfo</text>
      
      <text x="130" y="575" font-family="monospace" font-size="14" fill="#3d98d1">...</text>
    </g>
    
    <!-- Component Explanations -->
    <g id="explanations">
      <!-- NAR Directory Explanation -->
      <g id="nar-explanation">
        <rect x="600" y="180" width="450" height="180" rx="8" fill="#ffffff" stroke="#a8545b" stroke-width="2"/>
        <rect x="600" y="180" width="450" height="40" rx="8" fill="#a8545b"/>
        <text x="825" y="205" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
          NAR Directory (nar/)
        </text>
        
        <text x="620" y="245" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Contains compressed NAR archives
        </text>
        <text x="620" y="270" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Each archive = one /nix/store path
        </text>
        <text x="620" y="295" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Complete build outputs (binaries, files)
        </text>
        <text x="620" y="320" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • XZ or Zstandard compression
        </text>
        <text x="620" y="345" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Hash-addressed filenames
        </text>
      </g>
      
      <!-- NARINFO Explanation -->
      <g id="narinfo-explanation">
        <rect x="1100" y="180" width="450" height="220" rx="8" fill="#ffffff" stroke="#378450" stroke-width="2"/>
        <rect x="1100" y="180" width="450" height="40" rx="8" fill="#378450"/>
        <text x="1325" y="205" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
          NARINFO Files
        </text>
        
        <text x="1120" y="245" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Small text metadata files
        </text>
        <text x="1120" y="270" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Points to corresponding NAR file
        </text>
        <text x="1120" y="295" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Contains:
        </text>
        <text x="1140" y="320" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="13" fill="#3b5487">
          - File hash &amp; size
        </text>
        <text x="1140" y="342" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="13" fill="#3b5487">
          - Runtime references
        </text>
        <text x="1140" y="364" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="13" fill="#3b5487">
          - Cryptographic signatures
        </text>
        <text x="1140" y="386" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="13" fill="#3b5487">
          - Compression info
        </text>
      </g>
      
      <!-- Other Components -->
      <g id="other-components">
        <!-- nix-cache-info -->
        <rect x="600" y="420" width="450" height="160" rx="8" fill="#ffffff" stroke="#955890" stroke-width="2"/>
        <rect x="600" y="420" width="450" height="40" rx="8" fill="#955890"/>
        <text x="825" y="445" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
          nix-cache-info
        </text>
        <text x="620" y="485" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Descriptive metadata for entire cache
        </text>
        <text x="620" y="510" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Contains:
        </text>
        <text x="640" y="535" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="13" fill="#3b5487">
          - Cache version information
        </text>
        <text x="640" y="557" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="13" fill="#3b5487">
          - Supported features list
        </text>
        
        <!-- log directory -->
        <rect x="1100" y="420" width="450" height="180" rx="8" fill="#ffffff" stroke="#717171" stroke-width="2"/>
        <rect x="1100" y="420" width="450" height="40" rx="8" fill="#717171"/>
        <text x="1325" y="445" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
          log/ Directory
        </text>
        <text x="1120" y="485" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Build logs directory
        </text>
        <text x="1120" y="510" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Stores logs of build processes
        </text>
        <text x="1120" y="535" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Contains full output of each phase
        </text>
        <text x="1120" y="560" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • For debugging and auditing purposes
        </text>
        
        <!-- realisations directory -->
        <rect x="600" y="610" width="450" height="160" rx="8" fill="#ffffff" stroke="#8a6e08" stroke-width="2"/>
        <rect x="600" y="610" width="450" height="40" rx="8" fill="#8a6e08"/>
        <text x="825" y="635" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
          realisations/ Directory
        </text>
        <text x="620" y="675" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Content-addressed derivation mappings
        </text>
        <text x="620" y="700" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Maps derivations to CA store paths
        </text>
        <text x="620" y="725" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • For builds using CA-derivations
        </text>
        <text x="620" y="750" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" fill="#28395f">
          • Enables content-addressed builds
        </text>
      </g>
    </g>
    
    <!-- How It Works Together -->
    <g id="workflow">
      <rect x="50" y="790" width="1500" height="200" rx="10" fill="#ffffff" stroke="#4d6fb7" stroke-width="2"/>
      <rect x="50" y="790" width="1500" height="50" rx="10" fill="#4d6fb7"/>
      <text x="800" y="820" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">
        How Cache Components Work Together
      </text>
      
      <!-- Step 1 -->
      <g id="step1">
        <circle cx="200" cy="890" r="40" fill="#a8545b"/>
        <text x="200" y="897" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">1</text>
        <text x="200" y="950" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          Client requests
        </text>
        <text x="200" y="968" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          store path
        </text>
      </g>
      
      <!-- Arrow 1 -->
      <path d="M 240 890 L 340 890" fill="none" stroke="#3d98d1" stroke-width="3" marker-end="url(#arrow)"/>
      
      <!-- Step 2 -->
      <g id="step2">
        <circle cx="400" cy="890" r="40" fill="#378450"/>
        <text x="400" y="897" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">2</text>
        <text x="400" y="950" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          Fetch .narinfo
        </text>
        <text x="400" y="968" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          metadata
        </text>
      </g>
      
      <!-- Arrow 2 -->
      <path d="M 440 890 L 540 890" fill="none" stroke="#3d98d1" stroke-width="3" marker-end="url(#arrow)"/>
      
      <!-- Step 3 -->
      <g id="step3">
        <circle cx="600" cy="890" r="40" fill="#8a6e08"/>
        <text x="600" y="897" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">3</text>
        <text x="600" y="950" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          Verify signatures
        </text>
        <text x="600" y="968" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          &amp; hashes
        </text>
      </g>
      
      <!-- Arrow 3 -->
      <path d="M 640 890 L 740 890" fill="none" stroke="#3d98d1" stroke-width="3" marker-end="url(#arrow)"/>
      
      <!-- Step 4 -->
      <g id="step4">
        <circle cx="800" cy="890" r="40" fill="#4d6fb7"/>
        <text x="800" y="897" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">4</text>
        <text x="800" y="950" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          Download NAR
        </text>
        <text x="800" y="968" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          from nar/
        </text>
      </g>
      
      <!-- Arrow 4 -->
      <path d="M 840 890 L 940 890" fill="none" stroke="#3d98d1" stroke-width="3" marker-end="url(#arrow)"/>
      
      <!-- Step 5 -->
      <g id="step5">
        <circle cx="1000" cy="890" r="40" fill="#955890"/>
        <text x="1000" y="897" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">5</text>
        <text x="1000" y="950" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          Decompress &amp;
        </text>
        <text x="1000" y="968" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#28395f">
          install to store
        </text>
      </g>
    </g>
    
    <!-- Key Features Box -->
    <g id="key-features">
      <rect x="50" y="1030" width="740" height="170" rx="10" fill="#eeeeee" stroke="#3b5487" stroke-width="2"/>
      <text x="420" y="1060" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#28395f">
        Key Design Principles
      </text>
      
      <text x="80" y="1090" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="16" fill="#3b5487">
        ✓ Simple &amp; Flat: No complex hierarchy or databases
      </text>
      <text x="80" y="1120" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="16" fill="#3b5487">
        ✓ Backend-Agnostic: Works with S3, HTTP, filesystem
      </text>
      <text x="80" y="1150" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="16" fill="#3b5487">
        ✓ Content-Addressed: Hash-based naming ensures integrity
      </text>
      <text x="80" y="1180" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="16" fill="#3b5487">
        ✓ Scalable: Can handle millions of packages efficiently
      </text>
    </g>
    
    <!-- Summary Box -->
    <g id="summary">
      <rect x="810" y="1030" width="740" height="170" rx="10" fill="#e0f5e5" stroke="#378450" stroke-width="2"/>
      <text x="1180" y="1060" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#378450">
        In Essence
      </text>
      
      <text x="840" y="1100" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="16" fill="#28395f">
        Every cached store path = 1 NAR file + 1 NARINFO file
      </text>
      <text x="840" y="1130" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="16" fill="#28395f">
        • NAR files: The actual content (compressed)
      </text>
      <text x="840" y="1160" font-family="'Route 159', Arial, Helvetica, sans-serif" font-size="16" fill="#28395f">
        • NARINFO files: The metadata (where to find it, how to verify it)
      </text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#3d98d1"/>
    </marker>
  </defs>
</svg>
